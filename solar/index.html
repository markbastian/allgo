<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar System</title>
    <!-- The demo page's stylesheet: the readout and the fps meter are
         styled there, and this page only has to make them fill a window. -->
    <link href="../css/style.css" rel="stylesheet" type="text/css">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        #solar-system { position: fixed; inset: 0; }
        #solar-system canvas { display: block; }
        /* The controls float over the scene rather than hanging below it,
           which is where a demo card puts them. */
        #solar-system .lil-gui.lil-root {
            position: absolute; top: 12px; right: 12px; z-index: 6;
            max-height: calc(100vh - 24px); overflow-y: auto;
        }
        .app-title {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 7;
            padding: 6px 14px; border-radius: 999px; background: rgba(5, 7, 13, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #e8eaf2; font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
            white-space: nowrap;
        }
        .app-title a { color: #9aa3c0; font-weight: 400; font-size: 13px; margin-left: 10px; }
        @media (max-width: 640px) {
            /* The collapsed controls take the top of a phone; the tab
               already says what the page is. */
            .app-title { display: none; }
            #solar-system .lil-gui.lil-root { max-height: 45vh; }
        }
    </style>
</head>
<body data-app="solar-system">
<div class="app-title">Solar System<a href="../index.html">allgo demos</a></div>
<div id="solar-system"></div>
<script src="../js/compiled/allgo.js"></script>
</body>
</html>
