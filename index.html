<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>allgo</title>
    <meta name="description" content="Algorithms in Clojure and ClojureScript, each one running live in the browser.">
    <link href="css/gallery.css" rel="stylesheet" type="text/css">
</head>
<body>
<!-- The gallery. Every tile links to a demo running full window: the
     three with pages of their own go to them, the rest to play/?demo=<id>.
     The list is demos.json, which the player reads too; this page draws
     itself from it with the script below and loads none of the demos'
     bundle, so it is quick on a phone. -->
<div class="wrap">
    <header class="hero">
        <h1>allgo</h1>
        <p>Procedural generation, computational geometry, physics, numerical
            integration and astrodynamics, written in Clojure and ClojureScript,
            each one running live.</p>
        <div class="hero__links">
            <a href="https://github.com/markbastian/allgo">Source on GitHub</a>
        </div>
    </header>

    <h2 class="section-title">Featured</h2>
    <div class="featured" id="featured"></div>

    <div class="toolbar">
        <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search demos" autocomplete="off"
                   aria-label="Search demos">
        </label>
        <div class="chips" id="chips" role="group" aria-label="Topics"></div>
    </div>

    <main id="gallery" aria-live="polite">
        <noscript><p class="empty">The demos, and this list of them, need JavaScript.</p></noscript>
    </main>

    <footer>
        Each demo opens full screen; most have controls in a panel you can
        open and close. By Mark Bastian.
    </footer>
</div>

<script>
(function () {
    // A color and a line drawing for each topic, so a tile says what it is
    // before its words are read.
    var topics = {
        "Games":                 {hue: 352, glyph: '<path d="M5 21V9l2-2V4h2v2h2V4h2v2h2V4h2v3l2 2v12z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/>'},
        "Procedural Generation": {hue: 150, glyph: '<path d="M2.5 19.5l6-9.5 4 6 3-4 6 7.5z"/><circle cx="17" cy="6" r="2"/>'},
        "Geometry":              {hue: 265, glyph: '<path d="M3 19.5L12 4l9 15.5z"/><path d="M7.5 11.75h9M12 4v15.5M7.5 11.75l4.5 7.75 4.5-7.75"/>'},
        "Spatial Queries":       {hue: 200, glyph: '<rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 12h17M12 3.5v17"/><circle cx="7.5" cy="8" r="1"/><circle cx="16" cy="7" r="1"/><circle cx="8" cy="16.5" r="1"/><circle cx="16.5" cy="16" r="1"/>'},
        "Robotics":              {hue: 30,  glyph: '<path d="M4 20.5h8M8 20.5v-5l5-6.5 5.5 2.5"/><circle cx="8" cy="15.5" r="1.6"/><circle cx="13" cy="9" r="1.6"/><path d="M18.5 11l1.5-2.5M18.5 11l2 1.5"/>'},
        "Soft Bodies":           {hue: 320, glyph: '<path d="M12 3.5c5 0 8.5 3.5 8.5 8s-3.5 9-8.5 9-8.5-3.5-8.5-8 3.5-9 8.5-9z"/><path d="M8.5 9.5c1.5-1.5 5-1.5 7 1"/>'},
        "Rigid Bodies":          {hue: 45,  glyph: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>'},
        "Fluids":                {hue: 210, glyph: '<path d="M12 3c3.5 4.5 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 11 8.5 7.5 12 3z"/><path d="M9 15.5a3 3 0 0 0 3 3"/>'},
        "Flocking":              {hue: 175, glyph: '<path d="M3 9l3.5 2.5L10 9M9 16l3.5 2.5L16 16M14 6l3.5 2.5L21 6"/>'},
        "Orbits & Numerics":     {hue: 235, glyph: '<ellipse cx="12" cy="12" rx="9.5" ry="4.5" transform="rotate(-20 12 12)"/><circle cx="12" cy="12" r="2.5"/><circle cx="20" cy="9" r="1.2"/>'}
    };
    var cta = {"crossbows": "Play", "motorcycle": "Ride", "solar-system": "Explore"};

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    }

    function tile(d, featured) {
        var t = topics[d.group] || {hue: 230, glyph: '<circle cx="12" cy="12" r="8"/>'};
        var a = el("a", "tile" + (featured ? " tile--featured" : ""));
        a.href = d.href;
        a.style.setProperty("--hue", t.hue);
        a.dataset.group = d.group;
        a.dataset.text = (d.label + " " + d.blurb + " " + d.group + " " + d.badges.join(" ")).toLowerCase();
        var art = el("div", "tile__art");
        art.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + t.glyph + '</svg>';
        // A screenshot of the demo over the topic's picture, which shows
        // while it loads and stays if there is none (script/thumbnails.mjs
        // makes them). Lazily: a phone should not fetch thirty-seven
        // images to show the first six.
        var img = el("img", "tile__shot");
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", function () { img.remove(); });
        img.src = "thumbs/" + d.id + ".webp";
        art.appendChild(img);
        if (d.badges.length) {
            var bs = el("div", "badges");
            d.badges.forEach(function (b) {
                bs.appendChild(el("span", "badge badge--" + b.toLowerCase(), b));
            });
            art.appendChild(bs);
        }
        var body = el("div", "tile__body");
        body.appendChild(el("h3", "tile__title", d.label));
        body.appendChild(el("p", "tile__blurb", d.blurb));
        if (featured) body.appendChild(el("span", "tile__cta", (cta[d.id] || "Open") + " →"));
        a.appendChild(art);
        a.appendChild(body);
        return a;
    }

    fetch("demos.json").then(function (r) { return r.json(); }).then(function (catalog) {
        var demos = catalog.demos, groups = catalog.groups;
        var featured = document.getElementById("featured");
        demos.filter(function (d) { return d.featured; })
             .forEach(function (d) { featured.appendChild(tile(d, true)); });

        var gallery = document.getElementById("gallery");
        var sections = groups.map(function (g) {
            var sec = el("section");
            sec.dataset.group = g;
            var h = el("h2", "section-title", g);
            var n = el("span", "count");
            h.appendChild(n);
            var grid = el("div", "grid");
            demos.filter(function (d) { return d.group === g; })
                 .forEach(function (d) { grid.appendChild(tile(d, false)); });
            sec.appendChild(h);
            sec.appendChild(grid);
            gallery.appendChild(sec);
            return {sec: sec, count: n, tiles: Array.prototype.slice.call(grid.children)};
        });
        var empty = el("p", "empty", "No demos match.");
        empty.hidden = true;
        gallery.appendChild(empty);

        // The topic chips and the search narrow the same list, together.
        var chips = document.getElementById("chips"), topic = null;
        function chip(label, g) {
            var c = el("button", "chip", label);
            c.type = "button";
            c.setAttribute("aria-pressed", g === null ? "true" : "false");
            c.addEventListener("click", function () {
                topic = g;
                Array.prototype.forEach.call(chips.children, function (o) {
                    o.setAttribute("aria-pressed", o === c ? "true" : "false");
                });
                apply();
            });
            chips.appendChild(c);
        }
        chip("All", null);
        groups.forEach(function (g) { chip(g, g); });

        var search = document.getElementById("search");
        function apply() {
            var q = search.value.trim().toLowerCase(), shown = 0;
            sections.forEach(function (s) {
                var n = 0;
                s.tiles.forEach(function (t) {
                    var ok = (!topic || t.dataset.group === topic) && (!q || t.dataset.text.indexOf(q) >= 0);
                    t.hidden = !ok;
                    if (ok) n++;
                });
                s.sec.hidden = n === 0;
                s.count.textContent = n;
                shown += n;
            });
            empty.hidden = shown > 0;
        }
        search.addEventListener("input", apply);
        // "/" to search, as on most sites that have one.
        document.addEventListener("keydown", function (e) {
            if (e.key === "/" && document.activeElement !== search) {
                e.preventDefault();
                search.focus();
            }
        });
        apply();
    }).catch(function () {
        document.getElementById("gallery").appendChild(
            el("p", "empty", "The list of demos could not be loaded."));
    });
})();
</script>
</body>
</html>
