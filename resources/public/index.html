<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <title>Procedurals</title>
</head>
<body>
<header class="page-header">
    <h1>Procedurals</h1>
    <p>A playground of procedural generation techniques.</p>
    <div id="demo-picker"></div>
</header>
<main class="demo-grid">
    <section class="demo-card" data-demo="caves"
             data-label="Cellular Caves"
             data-blurb="Cellular automata carving connected caverns">
        <div id="app"></div>
    </section>
    <section class="demo-card" data-demo="delaunay"
             data-label="Delaunay / Voronoi"
             data-blurb="Bowyer&ndash;Watson triangulation and its dual">
        <div id="delaunay"></div>
    </section>
    <section class="demo-card" data-demo="terrain"
             data-label="Fractal Terrain"
             data-blurb="Diamond-square and TIN heightmaps in WebGL">
        <div id="terrain" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="boids"
             data-label="Flocking &mdash; 2D"
             data-blurb="Reynolds' boids on a canvas">
        <div id="boids" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="boids-voronoi"
             data-label="Flocking &mdash; Voronoi"
             data-blurb="The flock's Voronoi diagram, retriangulated each frame">
        <div id="boids-voronoi" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="boids-3d"
             data-label="Flocking &mdash; 3D"
             data-blurb="The same rules in three dimensions">
        <div id="boids-3d" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="boids-voronoi-3d"
             data-label="Flocking &mdash; Voronoi 3D"
             data-blurb="Voronoi polyhedra of the flock, rebuilt each frame">
        <div id="boids-voronoi-3d" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="lorenz"
             data-label="Lorenz &mdash; Numerical Integration"
             data-blurb="Chapter 4 of Montenbruck &amp; Gill, integrating in real time">
        <div id="lorenz" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="kepler"
             data-label="Kepler &mdash; Nystrom Integration"
             data-blurb="Two-body motion, and how each method holds its energy">
        <div id="kepler" class="demo-viewport"></div>
    </section>
    <section class="demo-card" data-demo="satellite"
             data-label="Satellite &mdash; Orbit Perturbations"
             data-blurb="Montenbruck &amp; Gill chapter 3 forces, integrated by chapter 4">
        <div id="satellite" class="demo-viewport"></div>
    </section>
</main>
<script src="js/compiled/procedurals.js" type="text/javascript"></script>
</body>
</html>
