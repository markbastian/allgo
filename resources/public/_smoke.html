<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="css/style.css" rel="stylesheet" type="text/css">
<style>body{margin:0;background:#05070d;padding:8px}#boids{width:500px;height:400px}
#err{color:#f66;font:12px monospace;white-space:pre-wrap;max-width:900px}</style>
</head><body>
<div id="boids" class="demo-viewport"></div>
<pre id="err"></pre>
<script src="js/compiled/allgo.js"></script>
<script>
function say(m){ document.getElementById('err').textContent += m + "\n"; console.log("SMOKE: "+m); }
window.onerror = function(m,s,l,c,e){ say("WINDOW ERROR: "+m+" :: "+(e&&e.stack||"")); };
(function poll(n){
  if (window.allgo && allgo.demo && allgo.demo.boids_viewer) {
    try { allgo.demo.boids_viewer.start_BANG_(); say("start! returned"); }
    catch(e){ say("THREW: "+e+"\n"+(e.stack||"")); }
    // step the sim directly to surface errors inside rAF
    setTimeout(function(){
      try {
        var f = allgo.simulation.boids.flock(5, [100,100]);
        var o = [allgo.simulation.boids.sphere_obstacle([50,50],10)];
        var p = cljs.core.js__GT_clj(JSON.parse('{}'));
        var stepped = allgo.simulation.boids.step(f, [100,100]);
        say("step no-obstacles OK, n=" + cljs.core.count(stepped));
      } catch(e){ say("STEP THREW: "+e+"\n"+(e.stack||"")); }
    }, 500);
    return;
  }
  if(n>0) setTimeout(function(){poll(n-1);},100); else say("TIMEOUT loading allgo");
})(60);
</script></body></html>
